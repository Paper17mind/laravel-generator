<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeGen v2 | Premium Dev Tool</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app" v-cloak>
        <!-- Loading Overlay -->
        <div v-if="loading" class="loading-overlay">
            <span class="loader"></span>
        </div>

        <sidebar 
            :projects="projects" 
            :tables="tables" 
            :selected-project="selectedProject" 
            :selected-table="selectedTable"
            @add-project="addNewProject"
            @select-project="selectProject"
            @add-table="addNewTable"
            @select-table="selectTable"
            @generate="generateCode"
        ></sidebar>

        <main class="main-content">
            <table-view 
                v-if="selectedTable"
                :selected-table="selectedTable"
                :columns="columns"
                :previews="previews"
                :active-preview-index="activePreviewIndex"
                :loading="loading"
                @delete-table="deleteTable"
                @save-table="saveTable"
                @add-column="addColumn"
                @update-column="updateColumn"
                @delete-column="deleteColumn"
                @set-relation="setRelation"
                @fetch-preview="fetchPreview"
                @copy-code="copyCode"
                @select-preview="(idx) => activePreviewIndex = idx"
            ></table-view>

            <project-details 
                v-else-if="selectedProject"
                :selected-project="selectedProject"
                :project-view-mode="projectViewMode"
                :tables="tables"
                :relationships="relationships"
                @delete-project="deleteProject"
                @save-project="saveProject"
                @change-view-mode="(mode) => projectViewMode = mode"
                @select-table="selectTable"
                @add-table="addNewTable"
                @start-drag="startDrag"
                @start-pan="startPan"
                @on-pan="onPan"
                @stop-pan="stopPan"
            ></project-details>

            <welcome-view 
                v-else 
                @add-project="addNewProject"
                @import-project="importProject"
            ></welcome-view>
        </main>

        <wizard-modal 
            :show-wizard="showWizard"
            :selected-project="selectedProject"
            :backend-components="backendComponents"
            @close="showWizard = false"
            @confirm-generate="confirmGenerate"
        ></wizard-modal>

        <ai-chat
            :selected-project="selectedProject"
            :loading="loading"
            @add-table="addNewTable"
            @import-project="importProject"
        ></ai-chat>
    </div>

    <!-- Utils -->
    <script src="assets/js/utils/SQLParser.js"></script>
    
    <!-- Components -->
    <script src="assets/components/Sidebar.js"></script>
    <script src="assets/components/TableView.js"></script>
    <script src="assets/components/ProjectDetails.js"></script>
    <script src="assets/components/WelcomeView.js"></script>
    <script src="assets/components/WizardModal.js"></script>
    <script src="assets/components/AIChat.js"></script>
    
    <!-- Application Logic -->
    <script src="assets/js/app.js"></script>
</body>
</html>
